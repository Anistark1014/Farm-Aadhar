  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Only register service worker in production or if explicitly enabled
          const isProduction = location.protocol === 'https:' || location.hostname === 'localhost';
          if (isProduction) {
            navigator.serviceWorker.register('/sw.js', {
              scope: '/',
              updateViaCache: 'none' // Prevent aggressive caching during development
            })
            .then((registration) => {
              console.log('Service Worker registered successfully:', registration.scope);
              
              // Prevent automatic updates that could cause page refreshes
              registration.addEventListener('updatefound', () => {
                console.log('Service Worker update found, but not forcing refresh');
              });
            })
            .catch((error) => {
              console.log('Service Worker registration failed:', error);
            });
          }
        });
      }
    </script>
  </body>
